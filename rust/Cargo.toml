[workspace]
resolver = "2"
members = ["crates/mirror-core", "crates/mirror-video", "crates/mirror-app", "crates/mirror-android", "crates/mirror-audio"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["3zT", "Zenvy Zenshiro"]

[workspace.dependencies]
windows = "0.62"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ureq = { version = "3", default-features = false, features = ["json"] }
log = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
