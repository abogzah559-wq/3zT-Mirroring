name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Sign and publish this version as a GitHub release
        type: boolean
        default: false

permissions:
  contents: write

env:
  ADB_REVISION: "37.0.1"
  ADB_SHA256: "45f4d63113e895ebde0c90f194099a4676b6ac653bd28d54314a9e022bbc1a99"
  SCRCPY_VERSION: "5.0.1"
  FFMPEG_VERSION: "9.0.2"
  FFMPEG_SHA256: "8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: scrcpy server (pinned, checksum verified)
        run: |
          $name = "scrcpy-server-v$env:SCRCPY_VERSION"
          $dest = "third_party/scrcpy/$name"
          Invoke-WebRequest "https://github.com/Genymobile/scrcpy/releases/download/v$env:SCRCPY_VERSION/$name" -OutFile $dest
          $want = (Select-String -Path third_party/scrcpy/SHA256SUMS.txt -Pattern " $name$").Line.Split(" ")[0]
          $got = (Get-FileHash -Algorithm SHA256 $dest).Hash.ToLowerInvariant()
          if ($got -ne $want) { throw "scrcpy server SHA-256 $got, expected $want" }

      - name: Android platform-tools (pinned, checksum verified)
        run: |
          $zip = "$env:RUNNER_TEMP\platform-tools.zip"
          Invoke-WebRequest "https://dl.google.com/android/repository/platform-tools_r$($env:ADB_REVISION)-win.zip" -OutFile $zip
          $got = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($got -ne $env:ADB_SHA256) { throw "platform-tools SHA-256 $got, expected $env:ADB_SHA256" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP -Force
          "PLATFORM_TOOLS=$env:RUNNER_TEMP\platform-tools" | Out-File -Append $env:GITHUB_ENV

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            make
            diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf

      - uses: actions/cache@v4
        id: ffmpeg
        with:
          path: ${{ runner.temp }}/ffmpeg-out
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-${{ hashFiles('native/build_ffmpeg.sh') }}

      - name: FFmpeg (static, LGPL)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          set -e
          T=$(cygpath -u "$RUNNER_TEMP")
          curl -sSfL "https://ffmpeg.org/releases/ffmpeg-$FFMPEG_VERSION.tar.xz" -o "$T/ffmpeg.tar.xz"
          echo "$FFMPEG_SHA256  $T/ffmpeg.tar.xz" | sha256sum -c -
          tar -xJf "$T/ffmpeg.tar.xz" -C "$T"
          bash native/build_ffmpeg.sh "$T/ffmpeg-$FFMPEG_VERSION" "$T/ffmpeg-build" "$T/ffmpeg-out" > "$T/ffmpeg-build.log" 2>&1 || { tail -50 "$T/ffmpeg-build.log"; exit 1; }

      - name: aacdec.dll and videodec.dll
        shell: msys2 {0}
        run: |
          set -e
          V=$(sed -n 's/^version = "\(.*\)"$/\1/p' rust/Cargo.toml | head -1)
          FF="$(cygpath -u "$RUNNER_TEMP")/ffmpeg-out"
          bash native/aacdec/build_aacdec.sh "$FF" mirroring "$V"
          bash native/videodec/build_videodec.sh "$FF" native/out "$V"

      - name: playfair.dll
        shell: cmd
        run: native\playfair\build.bat

      - name: Inno Setup 6.6+
        run: |
          choco upgrade innosetup -y --no-progress
          if ($LASTEXITCODE) { throw "choco failed" }

      - name: Rust checks and tests
        working-directory: rust
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE) { throw "cargo fmt" }
          cargo test --release --workspace
          if ($LASTEXITCODE) { throw "cargo test" }

      - name: Build
        run: ./packaging/build.ps1 -PlatformTools $env:PLATFORM_TOOLS

      - name: Release tag
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        run: |
          $v = (Select-String -Path rust/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag" -and "v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version $v" }
          "RELEASE_TAG=v$v" | Out-File -Append $env:GITHUB_ENV

      - name: Sign
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          python packaging/sign.py (Get-ChildItem release/*-Setup.exe).FullName
          if ($LASTEXITCODE) { throw "signing failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: 3zT-Mirroring-Setup
          path: release/*

      # Pull requests: the unpacked program too, to test on a PC next to the
      # installed version without replacing it. Never published.
      - name: Portable test build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: 3zT-Mirroring-portable-test
          path: dist/MirroringService
          retention-days: 7

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $notes = "release-notes.md"
          $section = (Get-Content CHANGELOG.md -Raw) -split "(?m)^## " | Where-Object { $_ -match "^$([regex]::Escape($tag.TrimStart('v')))\b" } | Select-Object -First 1
          if (-not $section) { $section = "$tag`n" }
          ($section -replace "^[^\n]*\n", "").Trim() | Set-Content $notes
          gh release create $tag (Get-ChildItem release/*).FullName --target "${{ github.sha }}" --title "3zT Mirroring $($tag.TrimStart('v'))" --notes-file $notes
